services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb
      POSTGRES_DB: kb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Langfuse 官方镜像依赖较多，生产请按其文档部署。
  # 这里给出最小可用组合，第 3 周需要 trace 时再启用。
  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://kb:kb@postgres:5432/kb
      NEXTAUTH_SECRET: change-me-in-real-deploy
      SALT: change-me-in-real-deploy
      NEXTAUTH_URL: http://localhost:3001
      TELEMETRY_ENABLED: "false"
    profiles: ["observability"]

volumes:
  pgdata:
  qdrant:
